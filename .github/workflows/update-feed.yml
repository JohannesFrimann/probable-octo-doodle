# Rebuilds the compact station feed every hour and publishes it as the only
# file on the `feed` branch, so main's history stays clean. The watch fetches:
# https://raw.githubusercontent.com/JohannesFrimann/IcelandGasPriceGarmin/feed/stations.json
name: Update station feed

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        run: |
          mkdir -p out
          python build_feed.py out/stations.json

      - name: Publish to feed branch
        run: |
          cd out
          git init -q -b feed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -q -m "Update station feed"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" feed
